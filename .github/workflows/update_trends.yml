name: Update Trends Data

on:
  schedule:
    - cron: '5 * * * *'   # 毎時5分（UTC）
  workflow_dispatch:       # 手動実行も可

permissions:
  contents: write   # trends_data.json をコミットするために必要（それ以外の権限は付与しない）

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 外部ActionはタグではなくコミットSHAで固定（タグ付け替えによる乗っ取り対策）
      - name: リポジトリをチェックアウト
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # 取得スクリプト実行中に認証情報を残さない

      - name: Python セットアップ
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-trends.txt

      - name: 依存パッケージをインストール（バージョン固定＋ハッシュ検証）
        run: pip install --require-hashes -r requirements-trends.txt

      - name: トレンドデータを取得
        run: python fetch_trends.py --force
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # トークンはこのステップにだけ渡す（第三者製の自動コミットActionは使わない）
      - name: 変更をコミット＆プッシュ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trends_data.json
          if git diff --cached --quiet; then
            echo "変更なし（コミット不要）"
            exit 0
          fi
          git commit -m "chore: update trends data [skip ci]"
          for i in 1 2 3; do
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push 競合 → 最新を取り込み再試行 ($i)"
            git pull --rebase "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_REF_NAME}"
          done
          exit 1
